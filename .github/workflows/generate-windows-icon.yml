name: Generate Sen Windows Icon

on:
  push:
    branches:
      - feat/sen-desktop-v02
    paths:
      - .github/workflows/generate-windows-icon.yml

permissions:
  contents: write

jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/sen-desktop-v02
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - name: Generate ICO
        run: |
          convert src-tauri/icons/icon.png -define icon:auto-resize=256,128,64,48,32,16 src-tauri/icons/icon.ico
      - name: Commit icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/icons/icon.ico
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: add Windows Sen icon"
          git push
