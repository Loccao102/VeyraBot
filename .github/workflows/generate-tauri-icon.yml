name: Generate Sen Tauri Icon

on:
  push:
    branches:
      - feat/sen-desktop-tauri
    paths:
      - .github/workflows/generate-tauri-icon.yml

permissions:
  contents: write

jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/sen-desktop-tauri
      - name: Install SVG converter
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - name: Generate Tauri icon
        run: |
          mkdir -p src-tauri/icons
          rsvg-convert -w 512 -h 512 public/lotus.svg -o src-tauri/icons/icon.png
      - name: Commit icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/icons/icon.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: add Sen Tauri icon"
          git push
